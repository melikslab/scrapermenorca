name: Scraper diario + Pages

on:
  schedule:
    - cron: "0 21 * * *"   # 021:00 UTC ≈ 23:00 Madrid
  workflow_dispatch:

permissions:
  contents: write         # necesario para auto-commit
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python (sin caché)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip cache purge || true
          pip install --no-cache-dir requests beautifulsoup4 lxml certifi

      - name: Asegurar carpeta public
        run: mkdir -p public

      - name: Ejecutar scraper (lee/escribe en public/)
        run: python scraper_historico.py
        env:
          DATA_DIR: public

      - name: Commit JSONs incrementales
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add public/**.json
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Datos diarios: propiedades + registro"
          git push origin main
      

      - name: Añadir .nojekyll e índice (opcional)
        run: |
          touch public/.nojekyll
          [ -f public/index.html ] || printf '<!doctype html><meta charset="utf-8"><title>Feed</title><h1>Feed JSON</h1><ul><li><a href="propiedades_menorca_estandarizado.json">propiedades</a></li><li><a href="registro_scraping.json">registro</a></li></ul>' > public/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
